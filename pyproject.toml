[project]
name = "restful-api-task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hiba Ibrahim Khanfar", email = "hibaibraheem140@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "pre-commit>=4.6.2",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
restful-api-task = "restful_api_task:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
